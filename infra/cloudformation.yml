AWSTemplateFormatVersion: "2010-09-09"
Description: >
  GateMate Phase 1 — Static frontend hosting.
  Private S3 bucket served via CloudFront (Origin Access Control),
  plus a GitHub Actions OIDC role for keyless CI/CD deploys.

Parameters:
  GitHubOrg:
    Type: String
    Default: rulyweisbach
    Description: GitHub username / org that owns the repo.
  GitHubRepo:
    Type: String
    Default: gatemate
    Description: GitHub repository name.
  GitHubBranch:
    Type: String
    Default: main
    Description: Branch allowed to deploy.
  DomainName:
    Type: String
    Default: ""
    Description: >
      Custom apex domain (e.g. gatemate.vip). Leave empty to use the
      default CloudFront URL only. When set, also set AcmCertificateArn
      and HostedZoneId.
  AcmCertificateArn:
    Type: String
    Default: ""
    Description: ARN of an ISSUED ACM certificate in us-east-1 covering the domain + www.
  HostedZoneId:
    Type: String
    Default: ""
    Description: Route 53 hosted zone ID for the domain (for the apex + www alias records).

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref DomainName, ""]]

Resources:
  # ──────────────────────────────────────────────────────────────
  # S3 bucket — private, holds the built React app
  # ──────────────────────────────────────────────────────────────
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "gatemate-site-${AWS::Region}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # CloudFront reads from S3 via Origin Access Control (no public bucket)
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "gatemate-oac-${AWS::AccountId}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # ──────────────────────────────────────────────────────────────
  # CloudFront distribution — global CDN + SPA routing
  # ──────────────────────────────────────────────────────────────
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: GateMate static site
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        # Custom domain (only when DomainName param is set)
        Aliases: !If
          - HasCustomDomain
          - [!Ref DomainName, !Sub "www.${DomainName}"]
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref AcmCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # AWS managed "CachingOptimized" policy
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        # SPA routing: serve index.html for client-side routes
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10

  # ──────────────────────────────────────────────────────────────
  # Route 53 — point the domain (apex + www) at CloudFront
  # CloudFront's fixed alias hosted-zone ID is Z2FDTNDATAQYW2.
  # ──────────────────────────────────────────────────────────────
  ApexAliasRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  WwwAliasRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "www.${DomainName}"
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  # ──────────────────────────────────────────────────────────────
  # GitHub Actions OIDC — keyless deploy (no stored AWS secrets)
  # ──────────────────────────────────────────────────────────────
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: gatemate-github-deploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOIDCProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/${GitHubBranch}"
      Policies:
        - PolicyName: gatemate-deploy-permissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: SyncSiteBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !GetAtt SiteBucket.Arn
                  - !Sub "${SiteBucket.Arn}/*"
              - Sid: InvalidateCache
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  SiteBucketName:
    Description: S3 bucket holding the built site (set as S3_BUCKET secret).
    Value: !Ref SiteBucket
  DistributionId:
    Description: CloudFront distribution ID (set as CLOUDFRONT_DISTRIBUTION_ID secret).
    Value: !Ref Distribution
  DeployRoleArn:
    Description: IAM role ARN for GitHub Actions (set as AWS_DEPLOY_ROLE_ARN secret).
    Value: !GetAtt GitHubDeployRole.Arn
  SiteURL:
    Description: Public URL of the app.
    Value: !Sub "https://${Distribution.DomainName}"
